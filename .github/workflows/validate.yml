name: Validate

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Skill runtime stays stdlib-only; pytest is a test-only dependency.
      - name: Install test runner
        run: python3 -m pip install "pytest>=8,<9"

      - name: Run tests
        run: python3 -m pytest
