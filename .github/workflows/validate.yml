name: Validate

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      # The runtime stays stdlib-only; pytest is the dev-group test runner (pyproject + uv.lock).
      - name: Run tests
        run: uv run --frozen pytest -q
