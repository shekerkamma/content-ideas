<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<!-- gemini-media-lane template (1080x1080). make_card.py fills {{TITLE}}, {{TAGLINE}} and copies the art to art.jpg.
     Every glyph is real text (Poppins); art.jpg must be text-free (check_media.py textfree). -->
<style>
  :root{--bg:#121a2d;--ink:#f4f6fa;--mute:#b4bccb;--cu:#d98a4e}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1080px;background:var(--bg);overflow:hidden}
  body{position:relative;font-family:"Poppins",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .art{position:absolute;left:0;right:0;bottom:0;height:640px;
       background:url(art.jpg) center 42%/cover no-repeat}
  /* fade the art's top edge into the text area so there is no seam */
  .art::before{content:"";position:absolute;inset:0 0 auto 0;height:220px;
       background:linear-gradient(var(--bg),rgba(18,26,45,0))}
  .copy{position:absolute;left:84px;right:84px;top:92px}
  .rule{width:72px;height:6px;border-radius:3px;background:var(--cu);margin-bottom:38px}
  h1{font-weight:600;font-size:148px;line-height:1;letter-spacing:-.01em;color:var(--ink);white-space:nowrap}
  p{margin-top:30px;font-weight:400;font-size:58px;line-height:1.22;color:var(--mute);max-width:620px}
</style></head>
<body>
  <div class="art" aria-hidden="true"></div>
  <div class="copy">
    <div class="rule"></div>
    <h1>{{TITLE}}</h1>
    <p>{{TAGLINE}}</p>
  </div>
</body></html>
