<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mixed axes</title>
<style>body{font:16px/1.5 system-ui;margin:0;padding:2rem}.centred{text-align:center}</style></head>
<body><main>
<!-- PLANTED: the h1 starts at the left, the second h2 is centred, so headings sit on two axes (align gate). -->
<h1>Page title on the left</h1>
<h2>Left section</h2><p>Body.</p>
<h2 class="centred">Centred section</h2><p>Body.</p>
</main></body></html>
