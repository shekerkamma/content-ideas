<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>broken fixture — every gate should find something</title>
<style>
  body { font-family: system-ui, sans-serif; background: #ffffff; color: #111827; margin: 0; padding: 24px; }
  /* 1.4.3 — #b9c0c8 on white is 1.9:1 */
  .faint { color: #b9c0c8; font-size: 16px; }
  /* 2.5.8 — 16x16 is under the 24x24 floor */
  .tiny { width: 16px; height: 16px; padding: 0; border: 0; background: #2563eb; }
  /* 1.4.10 — 900px of fixed width blows past a 320px viewport */
  .wide { width: 900px; background: #eef2ff; padding: 8px; }
  /* 2.3.3 — an animation with no prefers-reduced-motion policy anywhere */
  .spin { width: 40px; height: 40px; background: #2563eb; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  /* 1.4.11 / focus — the focus ring is removed outright */
  button:focus-visible { outline: none; }
</style>
</head>
<body>
  <h1>Broken by construction</h1>
  <p class="faint">This paragraph is #b9c0c8 on white — about 1.9:1, well under the 4.5:1 minimum.</p>
  <div class="wide">A 900px fixed-width block that cannot reflow to 320px.</div>
  <div class="spin"></div>
  <!-- 2.5.8 — adjacent 16x16 targets, so the spacing exception cannot rescue them -->
  <div style="display:flex;gap:0"><button class="tiny" aria-label="a"></button><button class="tiny" aria-label="b"></button><button class="tiny"></button></div>
  <!-- 2.1.1 — a custom control with no tabindex and no key handler -->
  <div role="button" onclick="void 0">Custom control the keyboard cannot reach</div>
  <button style="color:#c9d1d9;background:#e5e7eb">Low-contrast label</button>
  <img src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" width="20" height="20">
</body>
</html>
