<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}body{margin:0;width:1600px;height:900px;background:#202220;color:#f8f3ea;font-family:Arial,sans-serif;overflow:hidden}.wrap{padding:72px 84px}.track{display:flex;align-items:center;margin-top:120px}.node{width:260px;height:190px;border:3px solid #ded6c8;padding:28px}.node b{display:block;font-size:27px;margin-bottom:18px}.node span{font-size:18px;color:#d0c9c0}.arrow{width:86px;height:4px;background:#c8a46b;position:relative}.arrow:after{content:"";position:absolute;right:-2px;top:-10px;border-left:18px solid #c8a46b;border-top:12px solid transparent;border-bottom:12px solid transparent}.commit{border-color:#e33d2e;background:#e33d2e}.commit span{color:#fff}.local{border-color:#315c4a}.caption{margin-top:76px;font-size:24px;color:#c8a46b}.rule{height:4px;width:280px;background:#e33d2e;margin-top:18px}</style></head><body><div class="wrap"><div class="track"><div class="node"><b>DIVERGE</b><span>Expose materially different worlds</span></div><div class="arrow"></div><div class="node commit"><b>COMMIT</b><span>Name the owner and exit criterion</span></div><div class="arrow"></div><div class="node local"><b>CONVERGE</b><span>Compare bounded local variants</span></div><div class="arrow"></div><div class="node"><b>RELEASE</b><span>Challenge, approve, record</span></div></div><div class="caption">Choice creates value only when exploration ends in commitment.</div><div class="rule"></div></div></body></html>
