<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#ffffff"/>
  <text x="60" y="70" font-family="Arial" font-size="34" font-weight="700" fill="#0A1628">AI Agents Are The New SaaS - Editable Reconstruction Map</text>
  <text x="60" y="112" font-family="Arial" font-size="18" fill="#5B6B7C">SVG is a QA intermediate. Final deck visuals are rebuilt as editable PowerPoint shapes.</text>
  <g font-family="Arial" font-size="18" fill="#1B2B3C">
    <rect x="70" y="170" width="320" height="110" rx="14" fill="#F4F7F8" stroke="#D9DFE5"/>
    <text x="95" y="215" font-weight="700">Unit economics</text>
    <text x="95" y="250">Human cost -> AI cost -> ROI</text>
    <rect x="480" y="170" width="320" height="110" rx="14" fill="#E0F7F1" stroke="#D9DFE5"/>
    <text x="505" y="215" font-weight="700">Workflow scorecard</text>
    <text x="505" y="250">Frequency, pain, pattern, tools, budget</text>
    <rect x="890" y="170" width="320" height="110" rx="14" fill="#F4F7F8" stroke="#D9DFE5"/>
    <text x="915" y="215" font-weight="700">Shadow before build</text>
    <text x="915" y="250">Watch -> spec -> trusted agent</text>
    <rect x="70" y="370" width="320" height="110" rx="14" fill="#E0F7F1" stroke="#D9DFE5"/>
    <text x="95" y="415" font-weight="700">Agentic workflows</text>
    <text x="95" y="450">Sequential and hierarchical</text>
    <rect x="480" y="370" width="320" height="110" rx="14" fill="#F4F7F8" stroke="#D9DFE5"/>
    <text x="505" y="415" font-weight="700">Wrapper makes SaaS</text>
    <text x="505" y="450">Worker -> control room -> trust</text>
    <rect x="890" y="370" width="320" height="110" rx="14" fill="#E0F7F1" stroke="#D9DFE5"/>
    <text x="915" y="415" font-weight="700">Pilot to product</text>
    <text x="915" y="450">Promise -> pricing -> pattern</text>
  </g>
  <path d="M390 225 H470" stroke="#00C9A7" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M800 225 H880" stroke="#00C9A7" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M390 425 H470" stroke="#00C9A7" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M800 425 H880" stroke="#00C9A7" stroke-width="4" marker-end="url(#arrow)"/>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#00C9A7"/>
    </marker>
  </defs>
