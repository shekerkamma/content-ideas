<!doctype html>
<html><head><style>
  .root { width: 1280px; height: 720px; padding: 48px;
           box-sizing: border-box; background: #FFFFFF; color: #1E293B;
           font-family: "Aptos", Arial, sans-serif; }
  .dark { background: #0A1628; color: #FFFFFF; }
  .kicker { font-family: "Aptos", Arial, sans-serif; font-size: 13px;
             letter-spacing: 1.4px; text-transform: uppercase; color: #00B4D8; }
  .title { font-family: "Georgia", Cambria, serif; font-size: 40px;
            color: #1E293B; line-height: 1.15; margin: 10px 0 0 0; }
  .dark .title { color: #FFFFFF; }
  .cover { font-family: "Georgia", Cambria, serif; font-size: 64px;
            color: #FFFFFF; line-height: 1.08; }
  .rule { height: 2px; width: 120px; background: #00B4D8; margin: 14px 0 22px 0; }
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; }
  .card { border-radius: 8px; background: #F8FAFC;
           border: 1px solid #E2E8F0; padding: 18px; }
  .panel { border-radius: 8px; background: #F4F8FE;
            border: 1px solid #E2E8F0; padding: 18px; }
  .slab { border-radius: 8px; background: #0A1628; color: #FFFFFF; padding: 22px; }
  .ch { font-family: "Aptos", Arial, sans-serif; font-size: 20px; font-weight: 600; }
  .body { font-family: "Aptos", Arial, sans-serif; font-size: 18px; color: #1E293B; }
  .dark .body { color: #8DB4D4; }
  .kpi { font-family: "Georgia", Cambria, serif; font-size: 48px; color: #00B4D8; }
  .label { font-family: "Aptos", Arial, sans-serif; font-size: 13px; color: #6B7280; }
  .foot { font-family: "Aptos", Arial, sans-serif; font-size: 10px; color: #6B7280; }
  .node { border-radius: 8px; background: #0A9396; color: #FFFFFF; padding: 14px; }
  .ok { color: #12855B; }
</style></head><body>
<div class="root">
<div class="kicker">L15 &middot; GOVERNANCE</div><div class="title">Leaders above, capability grid below</div><div class="rule"></div>
<div class="grid"><div class="card" style="grid-column: span 4"><div class="ch">Sponsor</div><div class="body">Role evidence.</div></div><div class="card" style="grid-column: span 4"><div class="ch">Delivery lead</div><div class="body">Role evidence.</div></div><div class="card" style="grid-column: span 4"><div class="ch">Architect</div><div class="body">Role evidence.</div></div></div><div style='height:16px'></div><div class="grid"><div class="card" style="grid-column: span 3"><div class="ch">Security</div><div class="body">-</div></div><div class="card" style="grid-column: span 3"><div class="ch">Data</div><div class="body">-</div></div><div class="card" style="grid-column: span 3"><div class="ch">Change</div><div class="body">-</div></div><div class="card" style="grid-column: span 3"><div class="ch">Ops</div><div class="body">-</div></div></div>
<div class="foot">Client-Ready PPTX Design System &middot; layout reference</div>
</div></body></html>
