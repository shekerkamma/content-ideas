<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>{{brand_name}} — Cover Slide</title>
  <link rel="stylesheet" href="../_shared/base.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="canvas canvas--dark">

    <!-- Masthead -->
    <div class="masthead">
      <span class="masthead__label">June 2026</span>
      <span class="masthead__label">{{handle}}</span>
      <span class="masthead__label">{{tagline}}</span>
    </div>

    <!-- Hero Content -->
    <div class="cover-content">
      <div class="accent-bar"></div>

      <h1 class="cover-title display-xl">
        <!-- EDIT: Replace with your headline -->
        Stop Copying<br>Data By Hand
      </h1>

      <p class="cover-subtitle body-lg">
        <!-- EDIT: Replace with your subtitle/hook -->
        How to automate any data workflow in 20 minutes with Python.
      </p>

      <div class="cover-cta">
        <!-- EDIT: Replace with your CTA text -->
        <span class="cta-arrow">&#8594;</span>
        <span class="cta-text body-md">Swipe to learn how</span>
      </div>
    </div>

    <!-- Pagination -->
    <div class="pagination">
      <div class="pagination__dot pagination__dot--active"></div>
      <div class="pagination__dot"></div>
      <div class="pagination__dot"></div>
      <div class="pagination__dot"></div>
      <div class="pagination__dot"></div>
      <div class="pagination__dot"></div>
      <div class="pagination__dot"></div>
    </div>

  </div>
</body>
</html>
